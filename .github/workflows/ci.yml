name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: CLI tests
        run: sh tests/cli.sh
      - name: Smoke test
        run: tests/smoke.sh
